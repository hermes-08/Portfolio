<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First HTML Activity | Daniel Ray Zuñiga</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: #2c302e;
            background-image: linear-gradient(135deg, #3a3f3d 0%, #1a1c1b 100%); 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #f4f4f2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: 80px;
        }
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 65px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #e0f2fe;
            padding: 0 4rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            z-index: 1000;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #0f172a;
            text-decoration: none !important;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none !important;
            font-size: 0.95rem;
            font-weight: 500;
            color: #475569;
            position: relative;
            padding-bottom: 4px;
            transition: color 0.2s ease;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .nav-links a:hover {
            color: #0284c7;
        }

        .nav-links a.active {
            color: #0284c7;
            font-weight: 700;
        }

        .nav-links a.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #0284c7;
            border-radius: 2px;
        }
        .main-content {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px;
        }

        .activity-box {
            text-align: center;
            background: #222524; 
            padding: 50px 70px;
            border: 4px solid #8a948f; 
            border-radius: 4px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6),
                        0 0 0 8px #141615; 
            max-width: 700px;
            width: 90%;
            font-family: 'Cinzel', 'Georgia', 'Times New Roman', serif;
        }

        .activity-box h1 {
            font-size: 1.4rem; 
            color: #a9b3af; 
            text-transform: uppercase;
            letter-spacing: 5px; 
            font-weight: 400;
            margin: 0;
        } 

        .activity-box hr {
            border: 0;
            border-top: 1px solid #4a524f;
            margin: 15px 0;
        }

        .activity-box h2 {
            font-size: 2rem;
            color: #dfb76c; 
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        @media (max-width: 640px) {
            .navbar {
                padding: 0 1.5rem;
            }
            .activity-box {
                padding: 30px 25px;
            }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <a href="homepage.html" class="logo">DANIEL</a>
        <nav class="nav-links">
            <a href="homepage.html">Home</a>
            <a href="aboutme.html">About Me</a>
            <a href="portfolio.html" class="active">Portfolio</a>
            <a href="skills.html">Skills</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <!-- CARD CONTENT -->
    <main class="main-content">
        <div class="activity-box">
            <h1>DANIEL RAY Z. ZUÑIGA</h1>
            <hr>
            <h2>Welcome to my First HTML file</h2>
        </div>
    </main>

</body>
</html>
